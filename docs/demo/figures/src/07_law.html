<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>body{padding:0}.paper{position:absolute;left:460px;top:90px;width:1000px;height:760px;background:#fffdf7;box-shadow:0 12px 40px rgba(0,0,0,.12);padding:70px 80px}.paper h2{font-size:40px;font-weight:900;text-align:center;letter-spacing:.1em}.paper .sub{text-align:center;color:#52514e;font-size:24px;margin:10px 0 40px}.paper p{font-size:26px;line-height:1.9;color:#2b2a27;text-indent:1em}.paper .ln{height:14px;background:#e6e2d6;margin:20px 0;border-radius:3px}</style></head><body><div class="paper"><h2>建物の区分所有等に関する法律</h2><div class="sub">第三十一条第一項（2026年4月1日施行の条文から抜粋）</div><p>規約の設定、変更又は廃止は、集会において、区分所有者（議決権を有しないものを除く。以下この項前段において同じ。）の過半数（これを上回る割合を規約で定めた場合にあつては、その割合以上）の者であつて議決権の過半数（これを上回る割合を規約で定めた場合にあつては、その割合以上）を有するものが出席し、出席した区分所有者及びその議決権の各四分の三以上の多数による決議によつてする。</p></div></body></html>
